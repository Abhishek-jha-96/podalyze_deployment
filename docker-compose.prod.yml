services:
  frontend:
    build:
      context: ./services/podalyze
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_BASE_API_URL: ${VITE_BASE_API_URL}
    container_name: podalyze_frontend
    env_file:
      - ./.envs/.env.production
    environment:
      - ENVIRONMENT=production
    ports:
      - "5173:5173"
    restart: unless-stopped
    profiles:
      - prod
    networks:
      - podalyze_net

  frontend-dev:
    build:
      context: ./services/podalyze
      dockerfile: Dockerfile
      target: dev
    container_name: podalyze_frontend_dev
    env_file:
      - ./.envs/.env.production
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./services/podalyze:/home/appuser/app:Z
      - /home/appuser/app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - podalyze_net

  backend:
    build:
      context: ./services/podalyze_backend
      dockerfile: Dockerfile
    container_name: podalyze_backend
    env_file:
      - ./.envs/.env.production
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - mongo
      - inference-server
      - redis
    networks:
      - podalyze_net

  inference-server:
    build:
      context: ./services/podalyze_inference
      dockerfile: Dockerfile
    container_name: podalyze_inference_server
    env_file:
      - ./.envs/.env.production
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - model_cache:/app/models
      - inference_logs:/app/logs
    depends_on:
      - mongo
      - redis
    networks:
      - podalyze_net

  celery:
    build:
      context: ./services/podalyze_inference
      dockerfile: Dockerfile
    container_name: podalyze_celery
    env_file:
      - ./.envs/.env.production
    restart: unless-stopped
    depends_on:
      - redis
      - mongo
    command: python3 -m celery -A src.config.celery.app worker --loglevel=INFO
    networks:
      - podalyze_net

  redis:
    image: redis:7-alpine
    container_name: podalyze_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - podalyze_net

  mongo:
    image: mongo:8.0.8
    container_name: podalyze_mongo
    restart: unless-stopped
    env_file:
      - ./.envs/.env.production
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./backup:/backup
    networks:
      - podalyze_net
    command: mongod --auth --bind_ip_all

  mongo-express:
    image: mongo-express:latest
    container_name: podalyze_mongo_express
    restart: unless-stopped
    env_file:
      - ./.envs/.env.production
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - podalyze_net

  # nginx:
  #   image: nginx:alpine
  #   container_name: podalyze_nginx
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - nginx_logs:/var/log/nginx
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - podalyze_net

networks:
  podalyze_net:
    driver: bridge
    name: podalyze_network

volumes:
  mongo_data:
    driver: local
  model_cache:
    driver: local
  inference_logs:
    driver: local
  nginx_logs:
    driver: local
